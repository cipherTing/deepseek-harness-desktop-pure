name: Build Desktop packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Fork branch, tag, or commit to build
        required: true
        default: master
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            extension: dmg
          - platform: windows-x64
            runner: windows-latest
            extension: exe

    steps:
      - name: Checkout fork ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Desktop version mirrors
        run: pnpm desktop:version:check

      - name: Resolve Desktop version
        id: desktop-version
        shell: bash
        run: echo "version=$(node -p \"require('./desktop/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Build Desktop package
        run: pnpm desktop:build

      - name: Upload Desktop package
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-${{ matrix.platform }}-${{ steps.desktop-version.outputs.version }}
          path: desktop/dist/deepseek-harness-desktop-${{ matrix.platform }}-${{ steps.desktop-version.outputs.version }}.${{ matrix.extension }}
          if-no-files-found: error
