name: Build and release Desktop

on:
  workflow_dispatch:
    inputs:
      release_notes_zh:
        description: Concise Chinese Markdown bullet list of high-level user-facing changes. Required when publishing from master.
        required: false
        type: string
      release_notes_en:
        description: Concise English Markdown bullet list of high-level user-facing changes. Required when publishing from master.
        required: false
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - id: release
        name: Resolve Desktop version and source
        shell: bash
        env:
          RELEASE_NOTES_ZH: ${{ inputs.release_notes_zh }}
          RELEASE_NOTES_EN: ${{ inputs.release_notes_en }}
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          tag="v$version"
          source_sha="$(git rev-parse HEAD)"

          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            if [[ -z "${RELEASE_NOTES_ZH//[[:space:]]/}" || -z "${RELEASE_NOTES_EN//[[:space:]]/}" ]]; then
              echo "::error::Master releases require both Chinese and English release notes."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Release tag $tag already exists. Bump the Desktop version before rebuilding."
              exit 1
            else
              status=$?
              if [[ "$status" -ne 2 ]]; then
                echo "::error::Unable to check whether release tag $tag exists."
                exit "$status"
              fi
            fi
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 1

      # NSIS reads absolute resource paths with a 260-character limit.
      - name: Prepare short Windows build path
        id: windows-source
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          $buildWorkspace = Join-Path $env:RUNNER_TEMP 'dsh'
          git worktree add --detach $buildWorkspace $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "workspace=$buildWorkspace" >> $env:GITHUB_OUTPUT

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 xdg-user-dirs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ steps.windows-source.outputs.workspace || github.workspace }}

      - name: Check Desktop version mirrors
        run: pnpm desktop:version:check
        working-directory: ${{ steps.windows-source.outputs.workspace || github.workspace }}

      - name: Prepare the Harness bundle
        run: pnpm run bundle:prepare
        working-directory: ${{ steps.windows-source.outputs.workspace || github.workspace }}/desktop

      - name: Run Desktop node tests
        run: pnpm run test
        working-directory: ${{ steps.windows-source.outputs.workspace || github.workspace }}/desktop

      - name: Run Desktop Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        working-directory: ${{ steps.windows-source.outputs.workspace || github.workspace }}/desktop

      - name: Build and upload Desktop package
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: ${{ steps.windows-source.outputs.workspace || github.workspace }}/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
          releaseAssetNamePattern: deepdive-${{ matrix.platform }}-[version][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: deepdive-${{ matrix.platform }}-[version]-[bundle]
        env:
          DESKTOP_SKIP_BUNDLE: '1'
          # Signs the updater archive with the minisign key the app verifies
          # against `plugins.updater.pubkey`. Unset keys fail the build, which
          # keeps a release from shipping an update the app would reject.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # tauri-action's workflow artifacts carry the bundles it recognizes; the
      # signed updater archive is uploaded here explicitly so a release can
      # never ship the installers without the in-app update payload.
      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepdive-${{ matrix.platform }}-${{ needs.metadata.outputs.version }}-updater
          if-no-files-found: error
          path: |
            ${{ steps.windows-source.outputs.workspace || github.workspace }}/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            ${{ steps.windows-source.outputs.workspace || github.workspace }}/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.nsis.zip
            ${{ steps.windows-source.outputs.workspace || github.workspace }}/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  release:
    name: Publish v${{ needs.metadata.outputs.version }}
    if: github.ref == 'refs/heads/master'
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Desktop packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: deepdive-*-${{ needs.metadata.outputs.version }}-*
          path: release-input
          merge-multiple: true

      - name: Prepare versioned release assets
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          shopt -s nullglob
          # Artifacts land either flat (tauri-action) or under the build path
          # (the explicit updater upload), so collect each file by name at any
          # depth. The loops avoid `mapfile`, which macOS Bash 3.2 lacks.
          dmg=(); while IFS= read -r f; do dmg+=("$f"); done < <(find release-input -name '*.dmg')
          exe=(); while IFS= read -r f; do exe+=("$f"); done < <(find release-input -name '*.exe')
          deb=(); while IFS= read -r f; do deb+=("$f"); done < <(find release-input -name '*.deb')
          appimage=(); while IFS= read -r f; do appimage+=("$f"); done < <(find release-input -name '*.AppImage')
          mac_updater=(); while IFS= read -r f; do mac_updater+=("$f"); done < <(find release-input -name '*.app.tar.gz')
          mac_updater_sig=(); while IFS= read -r f; do mac_updater_sig+=("$f"); done < <(find release-input -name '*.app.tar.gz.sig')
          windows_updater=(); while IFS= read -r f; do windows_updater+=("$f"); done < <(find release-input -name '*.nsis.zip')
          windows_updater_sig=(); while IFS= read -r f; do windows_updater_sig+=("$f"); done < <(find release-input -name '*.nsis.zip.sig')
          linux_updater=(); while IFS= read -r f; do linux_updater+=("$f"); done < <(find release-input -name '*.AppImage.tar.gz')
          linux_updater_sig=(); while IFS= read -r f; do linux_updater_sig+=("$f"); done < <(find release-input -name '*.AppImage.tar.gz.sig')

          if [[ "${#dmg[@]}" -ne 1 || "${#exe[@]}" -ne 1 || "${#deb[@]}" -ne 1 || "${#appimage[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one DMG, one EXE, one DEB and one AppImage artifact."
            find release-input -maxdepth 2 -type f -print
            exit 1
          fi
          # The in-app updater only installs a signed archive, so a release
          # without one would leave every installed copy on the old version.
          if [[ "${#mac_updater[@]}" -ne 1 || "${#mac_updater_sig[@]}" -ne 1
            || "${#windows_updater[@]}" -ne 1 || "${#windows_updater_sig[@]}" -ne 1
            || "${#linux_updater[@]}" -ne 1 || "${#linux_updater_sig[@]}" -ne 1 ]]; then
            echo "::error::Expected one signed updater archive per platform."
            find release-input -maxdepth 2 -type f -print
            exit 1
          fi

          mkdir -p release-assets
          cp "${dmg[0]}" "release-assets/deepdive-macos-arm64-$VERSION.dmg"
          cp "${exe[0]}" "release-assets/deepdive-windows-x64-$VERSION.exe"
          cp "${deb[0]}" "release-assets/deepdive-linux-x64-$VERSION.deb"
          cp "${appimage[0]}" "release-assets/deepdive-linux-x64-$VERSION.AppImage"
          cp "${mac_updater[0]}" "release-assets/deepdive-macos-arm64-$VERSION.app.tar.gz"
          cp "${mac_updater_sig[0]}" "release-assets/deepdive-macos-arm64-$VERSION.app.tar.gz.sig"
          cp "${windows_updater[0]}" "release-assets/deepdive-windows-x64-$VERSION.nsis.zip"
          cp "${windows_updater_sig[0]}" "release-assets/deepdive-windows-x64-$VERSION.nsis.zip.sig"
          cp "${linux_updater[0]}" "release-assets/deepdive-linux-x64-$VERSION.AppImage.tar.gz"
          cp "${linux_updater_sig[0]}" "release-assets/deepdive-linux-x64-$VERSION.AppImage.tar.gz.sig"

      - name: Prepare bilingual release notes
        shell: bash
        env:
          RELEASE_NOTES_ZH: ${{ inputs.release_notes_zh }}
          RELEASE_NOTES_EN: ${{ inputs.release_notes_en }}
        run: |
          {
            printf '%s\n\n' '## 更新日志'
            printf '%s\n\n' "$RELEASE_NOTES_ZH"
            printf '%s\n\n' '## Release Notes'
            printf '%s\n' "$RELEASE_NOTES_EN"
          } > release-notes.md

      # `latest.json` is the endpoint in `plugins.updater.endpoints`, so it names
      # this release's signed archives and nothing else.
      - name: Write updater manifest
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs")
            const version = process.env.VERSION
            const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}`
            const entry = (name) => ({
              signature: readFileSync(`release-assets/${name}.sig`, "utf8").trim(),
              url: `${base}/${name}`,
            })
            const manifest = {
              version,
              notes: readFileSync("release-notes.md", "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": entry(`deepdive-macos-arm64-${version}.app.tar.gz`),
                "windows-x86_64": entry(`deepdive-windows-x64-${version}.nsis.zip`),
                "linux-x86_64": entry(`deepdive-linux-x64-${version}.AppImage.tar.gz`),
              },
            }
            writeFileSync("release-assets/latest.json", `${JSON.stringify(manifest, null, 2)}\n`)
          '

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --fail-on-no-commits
