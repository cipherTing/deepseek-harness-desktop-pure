name: Build and release Desktop

on:
  workflow_dispatch:
    inputs:
      release_notes_zh:
        description: Concise Chinese Markdown bullet list of high-level user-facing changes. Required when publishing from master.
        required: false
        type: string
      release_notes_en:
        description: Concise English Markdown bullet list of high-level user-facing changes. Required when publishing from master.
        required: false
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - id: release
        name: Resolve Desktop version and source
        shell: bash
        env:
          RELEASE_NOTES_ZH: ${{ inputs.release_notes_zh }}
          RELEASE_NOTES_EN: ${{ inputs.release_notes_en }}
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          tag="v$version"
          source_sha="$(git rev-parse HEAD)"

          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            if [[ -z "${RELEASE_NOTES_ZH//[[:space:]]/}" || -z "${RELEASE_NOTES_EN//[[:space:]]/}" ]]; then
              echo "::error::Master releases require both Chinese and English release notes."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Release tag $tag already exists. Bump the Desktop version before rebuilding."
              exit 1
            else
              status=$?
              if [[ "$status" -ne 2 ]]; then
                echo "::error::Unable to check whether release tag $tag exists."
                exit "$status"
              fi
            fi
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Desktop version mirrors
        run: pnpm desktop:version:check

      - name: Prepare the Harness bundle
        run: pnpm run bundle:prepare
        working-directory: desktop

      - name: Run Desktop node tests
        run: pnpm run test
        working-directory: desktop

      - name: Run Desktop Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        working-directory: desktop

      - name: Build and upload Desktop package
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
          releaseAssetNamePattern: deepseek-harness-desktop-${{ matrix.platform }}-[version][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: deepseek-harness-desktop-${{ matrix.platform }}-[version]
        env:
          DESKTOP_SKIP_BUNDLE: '1'

  release:
    name: Publish v${{ needs.metadata.outputs.version }}
    if: github.ref == 'refs/heads/master'
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Desktop packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: deepseek-harness-desktop-*-${{ needs.metadata.outputs.version }}
          path: release-input
          merge-multiple: true

      - name: Prepare versioned release assets
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          shopt -s nullglob
          dmg=(release-input/*.dmg)
          exe=(release-input/*.exe)

          if [[ "${#dmg[@]}" -ne 1 || "${#exe[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one DMG and one EXE artifact."
            find release-input -maxdepth 2 -type f -print
            exit 1
          fi

          mkdir -p release-assets
          cp "${dmg[0]}" "release-assets/deepseek-harness-desktop-macos-arm64-$VERSION.dmg"
          cp "${exe[0]}" "release-assets/deepseek-harness-desktop-windows-x64-$VERSION.exe"

      - name: Prepare bilingual release notes
        shell: bash
        env:
          RELEASE_NOTES_ZH: ${{ inputs.release_notes_zh }}
          RELEASE_NOTES_EN: ${{ inputs.release_notes_en }}
        run: |
          {
            printf '%s\n\n' '## 更新日志'
            printf '%s\n\n' "$RELEASE_NOTES_ZH"
            printf '%s\n\n' '## Release Notes'
            printf '%s\n' "$RELEASE_NOTES_EN"
          } > release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --fail-on-no-commits
