name: Build Desktop packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Fork branch, tag, or commit to build
        required: true
        default: master
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis

    steps:
      - name: Checkout fork ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Desktop version mirrors
        run: pnpm desktop:version:check

      - name: Build and upload Desktop package
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
          releaseAssetNamePattern: deepseek-harness-desktop-${{ matrix.platform }}-[version][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: deepseek-harness-desktop-${{ matrix.platform }}-[version]
