[package]
name = "deepseek-harness-desktop"
version = "0.2.0"
description = "DeepDive desktop distribution for DeepSeek Harness"
authors = ["DeepDive contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.96.0"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rmp-serde = "1.3.0"
rmpv = { version = "1.3.0", features = ["with-serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.11.5", features = ["unstable", "tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tokio = { version = "1.48.0", features = ["fs", "sync", "time"] }
ureq = "2"
url = "2.5.7"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace", "std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL", "std"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "=0.38.2"
webview2-windows = { package = "windows", version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }

[patch.crates-io]
tauri-runtime-wry = { path = "../patches/tauri-runtime-wry" }
wry = { path = "../patches/wry" }
